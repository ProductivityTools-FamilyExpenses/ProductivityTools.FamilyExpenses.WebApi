name: Build and Deploy1

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allow manual trigger

jobs:
  build-and-deploy:
    strategy:
      fail-fast: false # Pozwala jednemu runnerowi dokończyć wdrożenie nawet jeśli drugi napotka błąd
      matrix:
        include:
          - target-runner: "spendings-webapi"
            server-port: "8086"
            db-url: "jdbc:postgresql://10.0.0.3:5432/ptspendings"
            db-user: "postgres"
          - target-runner: "T460Ubuntu1"
            server-port: "8086"
            db-url: "jdbc:postgresql://localhost:5432/ptspendings"
            db-user: "postgres"

    runs-on: [ self-hosted, "${{ matrix.target-runner }}" ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # Identify user running the workflow
    - name: Identify User
      run: |
        echo "Running on runner: ${{ matrix.target-runner }}"
        whoami
        id

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Ensure PostgreSQL database exists (local PostgreSQL)
      if: matrix.target-runner == 'T460Ubuntu1'
      run: |
        echo "Ensuring database 'ptspendings' exists on local PostgreSQL..."
        sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname = 'ptspendings'" | grep -q 1 || sudo -u postgres createdb ptspendings

    - name: Build with Gradle
      env:
        SERVER_PORT: ${{ matrix.server-port }}
        DB_URL: ${{ matrix.db-url }}
        DB_USERNAME: ${{ matrix.db-user }}
        DB_PASS: ${{ secrets.DB_PASSWORD }}
      run: |
        if [ -n "$DB_PASS" ]; then
          export DB_PASSWORD="$DB_PASS"
        fi
        chmod +x gradlew
        ./gradlew --stop
        ./gradlew clean build --rerun-tasks

    - name: Stop application
      run: |
        echo "Stopping application"
        sudo systemctl stop spendings-webapi || true

    - name: Copy Jar to /opt/spendings-webapi
      run: |
        echo "Copying JAR to /opt/spendings-webapi"
        umask 002
        JAR=build/libs/spendings-webapi-0.0.1-SNAPSHOT.jar
        if [ ! -f "$JAR" ]; then
          echo "Jar not found at $JAR"; exit 1
        fi
        sudo mkdir -p /opt/spendings-webapi
        sudo cp "$JAR" /opt/spendings-webapi/

    - name: Configure environment variables and systemd service
      env:
        SERVER_PORT: ${{ matrix.server-port }}
        DB_URL: ${{ matrix.db-url }}
        DB_USER: ${{ matrix.db-user }}
        DB_PASS: ${{ secrets.DB_PASSWORD }}
        CORS_ORIGINS: "http://localhost:4200,https://pt-spendings.web.app,https://pt-spendings.firebaseapp.com"
      run: |
        echo "Configuring environment variables and systemd service file..."
        
        # 1. Create secure environment file with runner-specific configuration
        cat << EOF > /tmp/spendings-webapi.env
        SERVER_PORT=$SERVER_PORT
        DB_URL=$DB_URL
        DB_USERNAME=$DB_USER
        CORS_ALLOWED_ORIGINS=$CORS_ORIGINS
        EOF

        if [ -n "$DB_PASS" ]; then
          echo "DB_PASSWORD=$DB_PASS" >> /tmp/spendings-webapi.env
        fi

        sudo mv /tmp/spendings-webapi.env /opt/spendings-webapi/spendings-webapi.env
        sudo chmod 600 /opt/spendings-webapi/spendings-webapi.env

        # 2. Configure and install systemd service
        CURRENT_USER=$(whoami)
        cp deployment/spendings-webapi.service /tmp/spendings-webapi.service
        sed -i "s/USER_PLACEHOLDER/$CURRENT_USER/g" /tmp/spendings-webapi.service
        sudo mv /tmp/spendings-webapi.service /etc/systemd/system/spendings-webapi.service
        sudo systemctl daemon-reload

    - name: Start application
      run: |
        echo "Starting application"
        # enable, not just start: without it the service would not come back after a VM reboot
        sudo systemctl enable --now spendings-webapi
        sudo systemctl restart spendings-webapi
