server.port=${SERVER_PORT:8086}
spring.application.name=spendings-webapi
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ptspendings}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Pawel123}
# Comma-separated list of origins allowed to call /api/** (Angular dev server + Firebase Hosting pt-spendings)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://pt-spendings.web.app,https://pt-spendings.firebaseapp.com}
# Firebase project whose Authentication ID tokens are accepted (issuer https://securetoken.google.com/<project-id>)
app.firebase.project-id=${FIREBASE_PROJECT_ID:ptprojectsweb}
# Comma-separated allow-list of e-mails permitted to read data (override with ALLOWED_EMAILS if needed)
app.security.allowed-emails=${ALLOWED_EMAILS:pwujczyk@gmail.com,malgorzata.wujczyk@gmail.com}
